<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>三子棋</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
<meta name="apple-mobile-web-app-title" content="三子棋">
<meta name="theme-color" content="#fff4df">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Font loads without holding up the page: if Google Fonts can't be reached, system fonts are used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#3a2e5c; --muted:#8a80a8;
  --bg1:#fff4df; --bg2:#e3f2ff;
  --p0:#ff6b9a; --p1:#3fa7ff;
  --cell:#fffdf7; --cell2:#fff3e3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'ZCOOL KuaiLe','Baloo 2','PingFang SC','Hiragino Sans GB',system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.hidden{display:none!important}

.deco{position:fixed;font-size:46px;opacity:.5;pointer-events:none;z-index:0;left:-70px;animation:drift 30s linear infinite}
.deco:nth-child(1){top:6%;animation-duration:28s}
.deco:nth-child(2){top:48%;animation-duration:36s;animation-delay:-14s}
.deco:nth-child(3){top:82%;animation-duration:32s;animation-delay:-22s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 140px))}}

.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:10px 16px 24px;padding-top:max(10px,env(safe-area-inset-top))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:clamp(28px,7vw,40px);font-weight:400;letter-spacing:2px;line-height:1.1}
h1 span{color:var(--p0)} h1 em{font-style:normal;color:var(--p1)}
.round{background:#fff;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.08)}

/* ---------- setup ---------- */
.card{background:#fff;border-radius:26px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.07);margin-top:12px}
.lbl{font-size:20px;margin:0 0 8px}
.players-setup{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.players-setup{grid-template-columns:1fr}}
.pcard{background:#fff;border-radius:26px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.07);border:4px solid var(--pc);text-align:center}
.pcard .preview{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 4px 0 rgba(0,0,0,.12);animation:bob 1.8s ease-in-out infinite}
.pcard .pname{font-size:24px;color:var(--pc);margin-bottom:8px}
.roles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.role{padding:6px 14px;border-radius:999px;background:#f3f0fa;font-size:20px}
.role.on{background:var(--pc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.role:disabled{opacity:.3;cursor:default}
.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.animal{aspect-ratio:1;border-radius:16px;background:#f7f4ff;font-size:clamp(26px,7vw,34px);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.animal.on{background:var(--pc);transform:scale(1.1);box-shadow:0 3px 0 rgba(0,0,0,.15),0 0 0 3px #fff inset}
.animal:disabled{opacity:.2;cursor:default}

.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1;min-width:90px;padding:10px 8px;border-radius:18px;background:#f3f0fa;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt.on{background:#ffd34d;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.mini{display:grid;gap:2px}
.mini i{display:block;width:8px;height:8px;border-radius:2px;background:rgba(58,46,92,.35)}
.opt .av{font-size:30px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.btn{background:var(--p0);color:#fff;font-size:24px;padding:10px 26px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.big{display:block;width:100%;font-size:30px;padding:14px;margin-top:16px;animation:pulse 1.6s ease-in-out infinite}
.name-card{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name-card .lbl{margin:0}
#kidName{flex:1;min-width:120px;font:inherit;font-size:24px;color:var(--p0);padding:6px 14px;border-radius:999px;border:3px solid #f3f0fa;background:#fffdf7;outline:none;user-select:text;-webkit-user-select:text}
#kidName:focus{border-color:var(--p0)}
.sub{margin-top:12px}
.opt .av{line-height:1.1}
.opt small{font-size:14px;color:var(--muted)}
.link{background:none;color:var(--muted);font-size:16px;text-decoration:underline}

/* ---------- game ---------- */
.bar{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 4px}
.chip{flex:1;max-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 4px 0 rgba(0,0,0,.08);border:3px solid transparent;opacity:.5;transform:scale(.94);transition:all .3s}
.chip .av{width:52px;height:52px;flex:none;border-radius:50%;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:32px}
.chip .nm{font-size:22px;line-height:1}
.chip .sc{font-family:'Baloo 2',sans-serif;font-size:18px;color:var(--muted);line-height:1.2}
.chip.turn{opacity:1;transform:scale(1.04);border-color:var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.08),0 0 0 6px color-mix(in srgb,var(--pc) 22%,transparent)}
.chip.turn .av{animation:bob 1.2s ease-in-out infinite}
.chip.dance .av{animation:dance .5s ease-in-out infinite}
.chip .sc.bump{animation:pop .5s}
.vs{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--muted);font-size:20px}
.msg{text-align:center;font-size:clamp(22px,6vw,30px);min-height:1.4em;margin:6px 0 8px}
.msg b{font-weight:400;color:var(--tc)}
.msg.pop{animation:pop .35s}

.board-wrap{position:relative;width:var(--bw);margin:0 auto;
  --bw:min(94vw,600px,calc(100vh - 290px));
  --bw:min(94vw,600px,calc(100dvh - 290px));
}
.board{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(5px,1.4vw,9px);padding:clamp(8px,2vw,14px);background:#ffd9a8;border-radius:28px;box-shadow:0 8px 0 #f0b878,inset 0 0 0 4px rgba(255,255,255,.5)}
.cell{position:relative;aspect-ratio:1;border-radius:clamp(10px,3vw,20px);background:var(--cell);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s}
.cell:nth-child(odd){background:var(--cell2)}
.cell.open:hover{background:#fff8c9}
.cell.shake{animation:shake .4s}
.piece{width:86%;height:86%;border-radius:50%;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:calc(var(--bw) / var(--n) * .5);box-shadow:0 4px 0 rgba(0,0,0,.15);animation:drop .45s cubic-bezier(.3,1.6,.5,1)}
.piece.win{animation:winbounce .6s ease-in-out infinite;box-shadow:0 0 0 5px #fff,0 0 0 10px #ffd34d}
.piece.out{animation:poof .25s forwards}
.cell.hint::after{content:"";position:absolute;inset:8%;border-radius:50%;border:5px dashed #ffb020;animation:spin 3s linear infinite, glow 1s ease-in-out infinite}
.cell.hint::before{content:"✨";position:absolute;top:-8px;right:-6px;font-size:calc(var(--bw) / var(--n) * .3);z-index:2;animation:pop .5s}
#lineSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#lineSvg line{stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .5s ease-out forwards;opacity:.85}

.tools{display:flex;justify-content:center;gap:clamp(8px,3vw,16px);margin-top:18px}
.tool{background:#fff;border-radius:20px;padding:6px 12px;min-width:72px;font-size:26px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.tool span{font-size:16px;color:var(--muted)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tool:disabled{opacity:.35;cursor:default}

/* ---------- review (复盘) ---------- */
.reviewing .board-wrap{
  --bw:min(94vw,600px,max(240px,calc(100vh - 480px)));
  --bw:min(94vw,600px,max(240px,calc(100dvh - 480px)));
}
.reviewing .tools{display:none}
.review{margin-top:16px;background:#fff;border-radius:28px;padding:14px 16px 16px;box-shadow:0 6px 0 rgba(0,0,0,.07);border:4px solid var(--rc);animation:rise .45s cubic-bezier(.3,1.5,.5,1)}
.teacher{display:flex;align-items:flex-start;gap:10px}
.owl{font-size:54px;line-height:1;flex:none;animation:bob 1.6s ease-in-out infinite}
.say{flex:1;font-size:clamp(19px,5vw,25px);line-height:1.45;min-height:3em}
.say.pop{animation:pop .35s}
.rv-dots{display:flex;justify-content:center;gap:8px;margin:10px 0}
.rv-dots i{width:12px;height:12px;border-radius:50%;background:#eee6f8}
.rv-dots i.on{background:var(--rc);transform:scale(1.25)}
.rv-btns{display:flex;gap:10px}
.rv-btns .btn{flex:1;font-size:22px;padding:10px 8px;background:var(--rc)}
.rv-btns .btn.ghost{background:#f3f0fa;color:var(--ink);flex:.8}
.rv-foot{text-align:center;margin-top:8px}
.piece.dim{opacity:.28;filter:grayscale(.6);animation:none}
.piece.ghost{opacity:.3;animation:none;box-shadow:none;outline:4px dashed var(--pc);outline-offset:2px}
.piece.focus{animation:winbounce .9s ease-in-out infinite;box-shadow:0 0 0 4px #fff,0 0 0 9px #ffd34d}
.cell.spot{z-index:2}
.cell.spot::after{content:"";position:absolute;inset:4%;border-radius:50%;border:5px dashed #ffb020;animation:spin 3s linear infinite,glow 1s ease-in-out infinite}
.cell.spot::before{content:"👆";position:absolute;bottom:-22%;right:-12%;font-size:calc(var(--bw) / var(--n) * .42);z-index:3;animation:tapme .9s ease-in-out infinite}
.badge{position:absolute;top:-10%;left:-8%;z-index:3;min-width:46%;height:46%;padding:0 4px;border-radius:999px;background:#ffd34d;color:var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:calc(var(--bw) / var(--n) * .3);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.15);animation:pop .4s}
#lineSvg{transition:opacity .3s}
@keyframes tapme{0%,100%{transform:translateY(0)}50%{transform:translateY(-18%)}}

#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes dance{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.12)}}
@keyframes drop{0%{transform:translateY(-60%) scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes poof{to{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes winbounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12) translateY(-6%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{transform:translateY(120%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="deco">☁️</div><div class="deco">🎈</div><div class="deco">☁️</div>
<canvas id="fx"></canvas>

<div class="wrap">
  <header>
    <h1><span>三</span>子<em>棋</em> 🐾</h1>
    <button class="round" id="soundBtn" aria-label="声音">🔊</button>
  </header>

  <!-- setup screen -->
  <section id="setup">
    <div class="card name-card">
      <label class="lbl" for="kidName">小朋友叫什么名字？</label>
      <input id="kidName" maxlength="8" placeholder="宝宝" autocomplete="off" enterkeyhint="done">
    </div>

    <div class="card">
      <p class="lbl">和谁玩？</p>
      <div class="opts" id="modes"></div>
      <div class="sub hidden" id="levelBox">
        <div class="opts" id="levels"></div>
      </div>
    </div>

    <div class="players-setup" id="pcards"></div>

    <div class="card">
      <p class="lbl">棋盘多大？</p>
      <div class="opts" id="sizes"></div>
    </div>

    <div class="card">
      <p class="lbl">谁先下？</p>
      <div class="opts" id="firsts"></div>
    </div>

    <div class="card">
      <p class="lbl">要不要小提醒？</p>
      <div class="opts" id="teaches"></div>
    </div>

    <button class="btn big" id="startBtn">开始玩！▶</button>
    <div class="row-between">
      <span></span>
      <button class="link" id="resetScore">星星清零</button>
    </div>
  </section>

  <!-- game screen -->
  <section id="game" class="hidden">
    <div class="bar">
      <div class="chip" id="chip0"><div class="av"></div><div><div class="nm"></div><div class="sc"></div></div></div>
      <div class="vs">VS</div>
      <div class="chip" id="chip1"><div class="av"></div><div><div class="nm"></div><div class="sc"></div></div></div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board"></div>
      <svg id="lineSvg"></svg>
    </div>
    <div class="tools">
      <button class="tool" id="undoBtn">↩️<span>悔棋</span></button>
      <button class="tool" id="hintBtn">💡<span>提示</span></button>
      <button class="tool" id="newBtn">🔄<span>重来</span></button>
      <button class="tool" id="setupBtn">🐾<span>换人</span></button>
    </div>
    <div class="review hidden" id="review">
      <div class="teacher">
        <div class="owl">🦉</div>
        <div class="say" id="rvText"></div>
      </div>
      <div class="rv-dots" id="rvDots"></div>
      <div class="rv-btns">
        <button class="btn ghost" id="rvBack">🔊 再听一遍</button>
        <button class="btn" id="rvNext">下一步 ▶</button>
      </div>
      <div class="rv-foot hidden" id="rvFoot"><button class="link" id="rvSetup">🐾 换人</button></div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- data ---------- */
const ADULTS = ['爸爸', '妈妈', '外婆', '外公', '奶奶', '爷爷'];
const KIDKEY = '@kid'; // the kid's role is stored under this key; the name is typed in on the setup page
const ANIMALS = [
  { e: '🐰', n: '小兔子' }, { e: '🐻', n: '小熊' }, { e: '🐱', n: '小猫' }, { e: '🐶', n: '小狗' },
  { e: '🐼', n: '熊猫' }, { e: '🦄', n: '独角兽' }, { e: '🐸', n: '青蛙' }, { e: '🐥', n: '小鸡' },
  { e: '🦁', n: '狮子' }, { e: '🐷', n: '小猪' },
];
const COLORS = ['#ff6b9a', '#3fa7ff'];
const SIZES = [3, 4, 5];

const store = {
  get(k, d) { try { const v = localStorage.getItem('sanziqi-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sanziqi-' + k, JSON.stringify(v)); } catch (e) {} },
};

let KID = store.get('kid', null);
let players = store.get('players', [{ role: KIDKEY, animal: 0 }, { role: '妈妈', animal: 1 }]);
let size = store.get('size', 5);
let first = store.get('first', 0);
let scores = store.get('scores', {});
let solo = store.get('solo', false);   // play against a computer animal
let level = store.get('level', 0);     // 0 = the animal goes easy, 1 = it plays properly
let teach = store.get('teach', true);  // warn / nudge the kid during play
// Older versions saved the kid's name as the role itself. Move that to KIDKEY and keep the name and stars.
{
  const known = r => r === KIDKEY || ADULTS.includes(r);
  players.forEach(p => { if (!known(p.role)) { if (!KID && p.role !== '宝宝') KID = p.role; p.role = KIDKEY; } });
  if (players[0].role === players[1].role) players[1].role = ADULTS.find(r => r !== players[0].role);
  let moved = false;
  for (const k of Object.keys(scores)) if (!known(k) && !ANIMALS.some(a => a.n === k)) { scores[KIDKEY] = (scores[KIDKEY] || 0) + scores[k]; delete scores[k]; moved = true; }
  if (moved) store.set('scores', scores);
  KID = KID || '宝宝';
  store.set('kid', KID); store.set('players', players);
}
let soundOn = store.get('sound', true);

let board = [], turn = 0, history = [], over = false, locked = false, hintTimer = null, aiTimer = null;

// key = what stars are saved under; role = the name shown and spoken.
const P = i => {
  const raw = players[i].role, a = ANIMALS[players[i].animal], ai = solo && i === 1;
  return { i, a, color: COLORS[i], ai, kid: !ai && raw === KIDKEY, key: ai ? a.n : raw, role: ai ? a.n : raw === KIDKEY ? KID : raw };
};

/* ---------- sound & speech ---------- */
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type = 'sine', when = 0, vol = 0.15, toFreq) {
  if (!soundOn || !audio()) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur);
}
const sfxPlace = i => i === 0
  ? (tone(520, .12, 'triangle', 0, .18, 900), tone(1040, .12, 'sine', .08, .08))
  : (tone(330, .14, 'triangle', 0, .2, 560), tone(660, .12, 'sine', .08, .08));
const sfxBuzz = () => tone(200, .22, 'square', 0, .04, 130);
const sfxUndo = () => tone(700, .25, 'sine', 0, .12, 260);
const sfxHint = () => [988, 1319, 1568].forEach((f, i) => tone(f, .18, 'sine', i * .07, .08));
const sfxWin = () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', i * .11, .16)); tone(1568, .5, 'sine', .7, .1); };
const sfxDraw = () => [523, 494, 523].forEach((f, i) => tone(f, .2, 'sine', i * .15, .12));

function voice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const zh = vs.filter(v => /^zh[-_]CN/i.test(v.lang) || /^cmn/i.test(v.lang));
  return zh.find(v => /Tingting|婷婷|Lili|Xiaoxiao|Google/i.test(v.name)) || zh[0]
    || vs.find(v => /^zh/i.test(v.lang));
}
function say(text) {
  if (!soundOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voice(); if (v) u.voice = v;
  u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.2;
  speechSynthesis.speak(u);
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

function renderSound() { $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; }
$('soundBtn').onclick = () => {
  soundOn = !soundOn; store.set('sound', soundOn); renderSound();
  if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  else tone(880, .1);
};

/* ---------- setup screen ---------- */
function renderSetup() {
  const wrap = $('pcards'); wrap.innerHTML = '';
  [0, 1].forEach(i => {
    const p = P(i), other = players[1 - i];
    const c = document.createElement('div');
    c.className = 'pcard'; c.style.setProperty('--pc', p.color);

/* ---------- learning mode ----------
   On the kid's turn, if she is one piece away from winning, or the other player is,

function nudge(p) {
  const o = P(1 - p.i);
  let cells = movesThatWin(p.i), mine = true;
  if (!cells.length) { cells = movesThatWin(o.i); mine = false; }
  if (!cells.length) return false;
  const who = mine ? p.i : o.i;
  cells.forEach(c => {
    cellEl(c[0], c[1]).classList.add('hint');
    partners(board, c, who).forEach(x => cellEl(x[0], x[1]).querySelector('.piece')?.classList.add('focus'));
  });

    say(`${KID}看！${p.a.n}有两个连在一起了！再放一个到亮亮的格子，就赢啦！`);
  } else {

    say(`小心！${o.a.n}有两个连在一起了！${KID}快下在亮亮的格子，把它堵住！`);

/* ---------- computer player ---------- */
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function aiMove() {
  clearTimeout(aiTimer);
  aiTimer = setTimeout(() => {
    if (over || !P(turn).ai) return;
    const [r, c] = aiPick();
    tap(r, c, cellEl(r, c), true);
  }, 900 + Math.random() * 500);
}
function aiPick() {
  const me = turn, you = 1 - turn, hard = level === 1;
  const has = (list, c) => list.some(x => x[0] === c[0] && x[1] === c[1]);
  let empty = [];
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (board[r][c] === null) empty.push([r, c]);
  const wins = movesThatWin(me), blocks = movesThatWin(you);
  // Easy level is careless on purpose: it often misses its own win and often forgets to block.
  if (wins.length && (hard || Math.random() < .55)) return pickOne(wins);
  if (blocks.length && (hard || Math.random() < .4)) return pickOne(blocks);
  if (!hard) {
    const rest = empty.filter(c => !has(wins, c) && !has(blocks, c));
    if (rest.length) empty = rest;
  }
  // Otherwise play next to pieces already on the board. Hard level picks the square that sets up the most ways to win.
  const score = ([r, c]) => {
    let near = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
      if ((dr || dc) && inside(r + dr, c + dc) && board[r + dr][c + dc] !== null) near++;
    if (!hard) return Math.min(near, 1) + Math.random();
    board[r][c] = me; const mine = movesThatWin(me).length; board[r][c] = you; const theirs = movesThatWin(you).length; board[r][c] = null;
    const mid = (size - 1) / 2, far = Math.abs(r - mid) + Math.abs(c - mid);
    return mine * 10 + theirs * 6 + near - far * .5 + Math.random() * .5;
  };
  return empty.map(c => [score(c), c]).sort((a, b) => b[0] - a[0])[0][1];
}
// In a game against the computer, undo also takes back the computer's reply.
function undoCount() { return solo && !P(turn).ai ? 2 : 1; }

function tap(r, c, el, fromAi) {
  if (over || locked) return;
  if (P(turn).ai && !fromAi) return;
  if (board[r][c] !== null) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); sfxBuzz(); return; }
  clearHint();
  board[r][c] = turn;
  history.push([r, c]);
  const p = P(turn);
  el.classList.remove('open');
  el.innerHTML = `<div class="piece" style="--pc:${p.color}">${p.a.e}</div>`;
  sfxPlace(turn);
  locked = true; setTimeout(() => { locked = false; }, 350);

  const run = lineThrough(r, c, turn);
  if (run) return win(run);
  if (history.length === size * size) return draw();
  turn = 1 - turn;
  renderBar();

}

const inside = (r, c) => r >= 0 && c >= 0 && r < size && c < size;
function lineThrough(r, c, who) {
  let best = null;
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const cells = [[r, c]];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (inside(rr, cc) && board[rr][cc] === who) { cells.push([rr, cc]); rr += dr * s; cc += dc * s; }
    }
    if (cells.length >= 3 && (!best || cells.length > best.length)) best = cells;
  }
  return best && best.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}

function win(cells) {

function draw() {

/* ---------- review (复盘) ----------
   After every game the owl teacher walks through, one step at a time,
   why the game ended the way it did, in words a small kid can follow.
   The next game only starts from the last step. */
const NUM = ['一', '二', '三', '四', '五'];
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
let slides = [], slideAt = 0, slideTimers = [], reviewLine = null;

function withBoard(b, fn) { const real = board; board = b; try { return fn(); } finally { board = real; } }
// The board as it was after the first k moves.
function snapshot(k) {
  const b = Array.from({ length: size }, () => Array(size).fill(null));
  for (let i = 0; i < k; i++) { const [r, c] = history[i]; b[r][c] = board[r][c]; }
  return b;
}
// The pieces of `who` that a piece at `cell` would join into three in a row.
function partners(b, cell, who) {
  return withBoard(b, () => {
    b[cell[0]][cell[1]] = who;
    const run = lineThrough(cell[0], cell[1], who);
    b[cell[0]][cell[1]] = null;
    return run ? run.filter(x => !same(x, cell)) : [];
  });
}
// Most recent move (before move `upto`) where `by` took a spot the other player needed to win.
function lastBlock(by, upto) {
  for (let i = upto - 1; i >= 0; i--) {
    const cell = history[i], who = board[cell[0]][cell[1]];
    if (by != null && who !== by) continue;
    const two = partners(snapshot(i), cell, 1 - who);
    if (two.length >= 2) return { cell, who, two };
  }

}
function lineName(run) {
  if (run.every(c => c[0] === run[0][0])) return '横线';
  if (run.every(c => c[1] === run[0][1])) return '竖线';
  return '斜线';
}

function winSlides(w, l, run, cheer) {
  const n = history.length, W = history[n - 1], L = history[n - 2];
  const before = snapshot(n - 2); // the board when the loser made their last move
  const threats = withBoard(before, () => movesThatWin(w.i));
  const missed = withBoard(before, () => movesThatWin(l.i));
  const two = run.filter(c => !same(c, W));
  const out = [];

  // 1. cheer
  out.push({
    text: w.kid ? `${KID}赢啦！${cheer}`
      : l.kid ? `${w.role}赢啦！${KID}别难过，我们一起来看看，${w.role}是怎么赢的。`
      : `${w.role}赢啦！我们一起来看看，是怎么赢的。`,
    marks: { win: run, line: true },
  });

  // 2. count the line
  const count = run.map((_, k) => NUM[k]).join('、');
  out.push({
    text: `我们来数一数：${count}！${w.a.n}的${NUM[run.length - 1]}个棋子排成了一条${lineName(run)}，一个挨着一个，中间没有空格，就赢啦！`,
    marks: { dim: true, focus: run, line: true, badges: run.map((c, k) => ({ cell: c, text: k + 1, delay: 700 + k * 550 })) },
  });

  // 3. why the loser could not stop it
  const fork = threats.length >= 2;
  const blockedOne = threats.some(t => same(t, L));
  if (fork && blockedOne) {
    out.push({
      text: `再看这里：${l.role}已经堵住了一个地方，真不错！可是${w.a.n}在这里还有两个连在一起，${l.role}一次只能下一个，堵不过来啦。这是${w.role}的厉害招数：同时准备好两条路！`,
      marks: { dim: true, focus: [...two, L], ghost: [W], spot: [W], badges: [{ cell: L, text: '✋', delay: 300 }] },
    });
  } else if (fork) {
    out.push({
      text: `再看：${w.a.n}有两个地方都只差一个，就能连成三个。${l.role}一次只能堵一个，所以挡不住啦！这是${w.role}的厉害招数：同时准备好两条路！`,
      marks: { dim: true, focus: two, ghost: [W, L], spot: threats },
    });
  } else {
    out.push({
      text: `再看这里：赢之前，${w.a.n}已经有两个连在一起了，只差这一个空格。${l.role}要是先下在这里，就能把路堵住啦！`,
      marks: { dim: true, focus: two, ghost: [W, L], spot: [W] },
    });
  }

  // 4. one more thing worth seeing, if there is one
  if (missed.length) {
    const m = missed[0];
    out.push({
      text: `还有哦！其实${l.role}也差一点就赢了！${l.a.n}要是下在这个空格，也能连成三个呢。`,
      marks: { dim: true, focus: partners(before, m, l.i), ghost: [W, L], spot: [m] },
    });
  } else {
    const b = lastBlock(w.i, n - 1);
    if (b) out.push({
      text: `而且呀，${w.role}还在这里把${l.role}的路堵住了！${l.a.n}本来有两个连在一起，被${w.a.n}一挡，就连不起来啦。`,
      marks: { dim: true, focus: [b.cell, ...b.two], badges: [{ cell: b.cell, text: '✋', delay: 300 }] },
    });
  }

  // 5. the tip to remember
  out.push({
    text: w.kid
      ? `${KID}的小秘诀：先让自己的两个棋子连在一起，再找旁边的空格，放上第三个！还要记得，看到别人有两个连在一起，就赶快堵住！`
      : l.kid
      ? `小秘诀：每次下棋之前，先看一看，${w.role}有没有两个连在一起？有的话，赶快把旁边的空格堵住！下一局${KID}一定能行！`
      : `小秘诀：先让自己的两个棋子连在一起，再放上第三个。看到别人有两个连在一起，就赶快堵住！`,
    marks: { win: run, line: true },
  });
  return out;
}

function drawSlides() {
  const out = [{ text: '平局！棋盘放满啦，谁都没有连成三个。我们来看看为什么。', marks: {} }];
  const b = lastBlock(null, history.length);
  if (b) {
    const p = P(b.who), o = P(1 - b.who);
    out.push({
      text: `看这里！${o.a.n}本来有两个连在一起，只差一个就赢了。${p.role}赶快下在这里，把路堵住了，真聪明！`,

    });

  out.push({ text: `所以呀，看到别人有两个连在一起，就要赶快堵住！大家都很会堵，谁也没赢，都很棒！`, marks: {} });

function clearMarks() {

}

  const set = (cells, cls) => cells.forEach(c => { const p = piece(c); if (p) { p.classList.remove('dim'); p.classList.add(cls); } });
  set(win, 'win'); set(focus, 'focus'); set(ghost, 'ghost');

function startReview(list, color, run) {

  mark(s.marks);
  const t = $('rvText'); t.textContent = s.text;
  t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  $('rvDots').innerHTML = slides.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
  $('rvBack').textContent = last ? '🔄 再看一遍' : '🔊 再听一遍';
  $('rvNext').textContent = last ? '再来一局 ▶' : '下一步 ▶';
  $('rvFoot').classList.toggle('hidden', !last);
  say(s.text);
}
$('rvNext').onclick = () => {
  audio();
  if (slideAt < slides.length - 1) { tone(700, .1, 'triangle'); showSlide(slideAt + 1); }
  else { turn = first; newGame(); }
};
$('rvBack').onclick = () => {
  audio();
  if (slideAt < slides.length - 1) say(slides[slideAt].text);
  else showSlide(0);
};
$('rvSetup').onclick = () => $('setupBtn').click();

function drawLine(cells, color) {
  const wrap = $('boardWrap').getBoundingClientRect();
  const center = ([r, c]) => { const b = cellEl(r, c).getBoundingClientRect(); return [b.left - wrap.left + b.width / 2, b.top - wrap.top + b.height / 2]; };
  const [x1, y1] = center(cells[0]), [x2, y2] = center(cells[cells.length - 1]);
  const len = Math.hypot(x2 - x1, y2 - y1) + 1;
  const w = cellEl(0, 0).getBoundingClientRect().width * .22;
  $('lineSvg').style.opacity = 1;
  $('lineSvg').innerHTML = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" style="--len:${len}"/>`;
}

// The line is drawn in pixels, so redraw it when the screen is rotated or resized.
addEventListener('resize', () => { if (over && reviewLine && $('lineSvg').style.opacity !== '0') drawLine(reviewLine.cells, reviewLine.color); });

$('newBtn').onclick = () => { if (history.length && !over && !confirm('重新开始这一局吗？')) return; turn = first; newGame(); };
$('setupBtn').onclick = () => {
  if (history.length && !over && !confirm('不下这一局了，去换人吗？')) return;
  if (window.speechSynthesis) speechSynthesis.cancel();
  clearTimeout(aiTimer);
  endReview(); $('game').classList.add('hidden'); $('setup').classList.remove('hidden');
  store.set('first', first); renderSetup();
};

$('undoBtn').onclick = () => {
  const n = undoCount();
  if (over || history.length < n) return;
  clearTimeout(aiTimer);
  clearHint();
  for (let k = 0; k < n; k++) {
    const [r, c] = history.pop();
    board[r][c] = null;
    const el = cellEl(r, c), piece = el.querySelector('.piece');
    piece.classList.add('out');
    setTimeout(() => { if (board[r][c] === null) { el.innerHTML = ''; el.classList.add('open'); } }, 250);
    turn = 1 - turn;
  }
  sfxUndo();
  renderBar();
  announceTurn(false);
};

/* ---------- hint ---------- */
function movesThatWin(who) {
  const out = [];
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (board[r][c] === null) {
    board[r][c] = who; if (lineThrough(r, c, who)) out.push([r, c]); board[r][c] = null;
  }
  return out;
}
function nearMine(who) {
  const out = [];
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (board[r][c] === null) {
    let n = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
      if ((dr || dc) && inside(r + dr, c + dc) && board[r + dr][c + dc] === who) n++;
    if (n) out.push({ r, c, n });
  }
  out.sort((a, b) => b.n - a.n || Math.random() - .5);
  return out.slice(0, 2).map(o => [o.r, o.c]);
}
function clearHint() {
  clearTimeout(hintTimer);
  document.querySelectorAll('.cell.hint').forEach(e => e.classList.remove('hint'));
  document.querySelectorAll('#board .piece.focus').forEach(e => e.classList.remove('focus'));
}
$('hintBtn').onclick = () => {
  if (over || P(turn).ai) return;
  clearHint();
  const p = P(turn);
  let cells = movesThatWin(turn), text, speech;
  if (cells.length) { text = '下这里就赢啦！'; speech = '下在亮亮的地方，就连成三个啦！'; }
  else if ((cells = movesThatWin(1 - turn)).length) { text = '快堵住这里！'; speech = '小心！快把这里堵住！'; }
  else {
    cells = nearMine(turn);
    if (!cells.length) { const m = Math.floor(size / 2); cells = board[m][m] === null ? [[m, m]] : nearMine(1 - turn).slice(0, 1); }
    text = '下这里试试？'; speech = '下在这里试试看？';
  }
  if (!cells.length) return;
  cells.forEach(([r, c]) => cellEl(r, c).classList.add('hint'));
  setMsg(`💡 <b>${text}</b>`, p.color);
  sfxHint(); say(speech);
  hintTimer = setTimeout(clearHint, 5000);
};

/* ---------- confetti ---------- */
const fx = $('fx'), ctx = fx.getContext('2d');
let parts = [], raf = null;
function sizeFx() { const d = window.devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', sizeFx); sizeFx();
function confetti(color, emoji) {
  const cols = [color, '#ffd34d', '#7ee0a1', '#b58cff', '#ffffff'];
  for (let i = 0; i < 120; i++) {
    const isEmoji = i % 8 === 0;
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 6,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
      s: isEmoji ? 28 + Math.random() * 14 : 6 + Math.random() * 8,
      c: cols[i % cols.length], e: isEmoji ? (i % 16 === 0 ? '⭐' : emoji) : null, life: 0,
    });
  }
  if (!raf) raf = requestAnimationFrame(step);
}
function step() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 60 && p.life < 300);
  for (const p of parts) {
    p.life++; p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.e) { ctx.font = `${p.s}px serif`; ctx.textAlign = 'center'; ctx.fillText(p.e, 0, 0); }
    else { ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
    ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(step) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
}

/* ---------- go ---------- */
renderSound();
renderSetup();

// Keeps a copy of the game on the device so it opens without internet.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
